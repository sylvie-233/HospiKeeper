# ============================================================================
# HospiKeeper 本地环境 MySQL / Redis 编排
#
# 启动：    docker compose -f Scripts/docker-compose.yml up -d --wait
# 停止：    docker compose -f Scripts/docker-compose.yml down
# 重置：    docker compose -f Scripts/docker-compose.yml down -v（会清空数据）
#
# 环境变量可写入同目录 .env 文件覆盖默认值（如 MYSQL_ROOT_PASSWORD、MYSQL_PORT）。
# ============================================================================
name: hospikeeper

services:
  mysql:
    image: mysql:8.0
    container_name: hospikeeper-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hospikeeper}
      MYSQL_USER: ${MYSQL_USER:-hospikeeper}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    volumes:
      # 表结构与演示数据由 HospiKeeper.Api 启动时通过 EF Core Migrations 自动创建。
      # Docs/民宿管理系统-数据库设计-v1.sql 保留为数据库设计参考。
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: hospikeeper-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # --------------------------------------------------------------------------
  # 应用容器（profile: apps，仅 `manage.ps1 image:*` 或显式 profile 启动）
  # 镜像由 manage.ps1 image:build 使用本机 .NET 10 基础镜像构建。
  # --------------------------------------------------------------------------
  api:
    image: hospikeeper-api:local
    container_name: hospikeeper-api
    profiles: ["apps"]
    restart: unless-stopped
    build:
      context: ..
      dockerfile: src/HospiKeeper.Api/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Urls: http://+:8080
      HOSPITKEEPER_DB_HOST: mysql
      HOSPITKEEPER_DB_PORT: "3306"
      HOSPITKEEPER_DB_NAME: ${MYSQL_DATABASE:-hospikeeper}
      HOSPITKEEPER_DB_USER: ${MYSQL_USER:-hospikeeper}
      HOSPITKEEPER_DB_PASSWORD: ${MYSQL_PASSWORD:-123456}
      Cache__RedisConnectionString: redis:6379
      SYLVIE233_LOG_CONSOLE: "true"
      SYLVIE233_LOG_FILE: "false"
    ports:
      - '${API_PORT:-5080}:8080'

  web:
    image: hospikeeper-web:local
    container_name: hospikeeper-web
    profiles: ["apps"]
    restart: unless-stopped
    build:
      context: ..
      dockerfile: src/HospiKeeper.Web/Dockerfile
    depends_on:
      api:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Api__BaseUrl: http://api:8080
      SYLVIE233_LOG_CONSOLE: "true"
      SYLVIE233_LOG_FILE: "false"
    ports:
      - '${WEB_PORT:-5081}:8080'

volumes:
  mysql_data:
    name: hospikeeper_mysql_data
