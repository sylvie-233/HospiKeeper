# ============================================================================
# HospiKeeper 本地环境 MySQL 编排
#
# 启动：    docker compose -f Scripts/docker-compose.yml up -d
# 停止：    docker compose -f Scripts/docker-compose.yml down
# 重置：    docker compose -f Scripts/docker-compose.yml down -v（会清空数据）
#
# 环境变量可写入同目录 .env 文件覆盖默认值（如 MYSQL_ROOT_PASSWORD、MYSQL_PORT）。
# ============================================================================
name: hospikeeper

services:
  mysql:
    image: mysql:8.0
    container_name: hospikeeper-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hospikeeper}
      MYSQL_USER: ${MYSQL_USER:-hospikeeper}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      # 仅在数据目录为空（首次初始化）时执行
      - ../Docs/民宿管理系统-数据库设计-v1.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  mysql_data:
    name: hospikeeper_mysql_data
